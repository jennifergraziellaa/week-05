<!doctype html>
<html>
  <head>
    <title>Isian</title>
  </head>
  <body>
    <a href="CV.html" title="CV Data Diri" style="color: black"> <h1> >DATA DIRI </h1> </a>
    <form action="terima.html">
      <label for="nama"> Nama </label>
      <input
        type="text"
        id="nama"
        name="nama"
        required
        placeholder="Jane Doe"
      />
      <br />

      <label for="namax"> Nama Panggilan </label>
      <input type="text" id="namax" name="namax" placeholder="Jane" /> <br />

      <label for="nrp"> No Reg Mahasiswa </label>
      <input type="text" id="nrp" name="nrp" required placeholder="9 digit" />
      <br />

      <label for="pwd"> Password </label>
      <input type="password" id="pwd" name="pwd" required /> <br />

      <label for="email"> Alamat Email </label>
      <input
        type="email"
        id="surel"
        name="surel"
        required
        placeholder="nama@domain.com"
      />
      <br />

      <label for="telp"> No Telepon </label>
      <input type="tel" id="telp" name="nohp" required /> <br />
      <label for="ultah"> Tanggal Lahir </label>
      <input type="date" id="ultah" name="ultah" required /> <br />

      <label for="gender"> Gender </label> <br />
      <fieldset>
        <input type="radio" name="gender" value="L" /> Cowok <br />
        <input type="radio" name="gender" value="P" /> Cewek <br />
        <input type="radio" name="gender" value="X" checked /> Tidak mau mengisi
        <br />
      </fieldset>

      <label for="pakar"> Keahlian</label> <br />
      <fieldset>
        <input type="checkbox" name="pakar" value="PS" /> Photoshop <br />
        <input type="checkbox" name="pakar" value="AI" /> Illustrator <br />
      </fieldset>
      <input type="submit" />
    </form>
  </body>
</html>
